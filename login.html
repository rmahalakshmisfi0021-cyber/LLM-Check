<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.5rem; text-align: center; color: #111827; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.9rem; color: #374151; }
    input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid #4f46e5; border-color: transparent; }
    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .message { min-height: 1.25rem; margin-top: 1rem; font-size: 0.9rem; text-align: center; }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" />

      <button type="submit">Log in</button>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const message = document.getElementById('message');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value;

      message.className = 'message error';
      if (!form.email.checkValidity() || !email) {
        message.textContent = 'Please enter a valid email address.';
        return;
      }
      if (password.length < 6) {
        message.textContent = 'Password must be at least 6 characters.';
        return;
      }

      // Placeholder: replace with a POST to your authentication endpoint over HTTPS.
      message.className = 'message success';
      message.textContent = 'Logged in successfully!';
      form.reset();
    });
  </script>
</body>
</html>
